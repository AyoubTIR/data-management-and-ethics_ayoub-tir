version: 2

# Exposures = the things OUTSIDE dbt that use our models (dashboards, reports, ML models).
# They appear at the end of the lineage graph: impact analysis starts here.
exposures:
  - name: sales_dashboard
    label: Sales dashboard (Metabase)
    type: dashboard
    maturity: high
    owner:
      name: Sara Martin
      email: sara.martin@shopfast.example
    depends_on:
      - ref('fct_orders')
    description: "Daily revenue, orders and conversion per channel. Opened every morning by the CEO."

  # TODO (Exercise 2): add the Finance monthly revenue report (depends on fct_orders)
  # TODO (Exercise 2): add the churn-prediction ML model (depends on dim_customers)
  - name: finance_monthly_revenue_report
    label: Finance monthly revenue report (board)
    type: analysis
    maturity: high
    owner:
      name: Paul Girard
      email: paul.girard@shopfast.example
    depends_on:
      - ref('fct_orders')
    description: "Monthly net revenue (excl. VAT, after refunds) presented to the board and used for the annual accounts."

  - name: churn_prediction_model
    label: Churn prediction ML model
    type: ml
    maturity: medium
    owner:
      name: Head of Data Science
      email: data.science@shopfast.example
    depends_on:
      - ref('dim_customers')
    description: "Weekly scoring of churn risk per customer. Features: lifetime_orders, last_order_date, lifetime_net_revenue_eur. Feeds marketing retention campaigns."